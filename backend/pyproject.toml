[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "private-agent-backend"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.3,<3",
    "python-dotenv>=1.1,<2",
    "pywin32>=310; sys_platform == 'win32'",
    "markdownify>=1.2,<2",
    "beautifulsoup4>=4.12,<5",
    # Pictures of imported files: TIFF and, on Windows, EMF/WMF metafiles become PNG.
    "pillow>=11.3,<13",
    # Pinned: npm run setup:browser and build:browser install the Chromium build of this release, which the backend
    # needs, so a new release needs both run again.
    "playwright==1.63.0",
]

[project.optional-dependencies]
# Development only, never in the backend executable: tests and their coverage (npm run test:python:coverage), the
# PyInstaller build, and debugpy for PRIVATE_AGENT_DEBUGPY (backend/main.py).
dev = ["pytest>=8.3,<10", "pyinstaller>=6.12,<7", "coverage>=7.10,<8", "debugpy>=1.8,<2"]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
# What a test needs beyond Python; backend/tests/conftest.py skips it elsewhere.
markers = [
    "windows(reason): runs only on Windows",
    "office: needs desktop Office on Windows; runs only with PRIVATE_AGENT_OFFICE_TEST=1",
    "browser: drives Playwright's Chromium (npm run setup:browser); skipped without it unless PRIVATE_AGENT_REQUIRE_BROWSER=1",
]
