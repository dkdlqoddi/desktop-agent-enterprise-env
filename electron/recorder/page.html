<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Private Agent 녹화</title>
    <link rel="stylesheet" href="page.css" />
  </head>
  <body>
    <main id="capture" class="capture" hidden>
      <span class="dot" aria-hidden="true"></span>
      <div class="status">
        <strong>녹화 중 <span id="elapsed">00:00</span> <span id="step"></span></strong>
        <span id="caption">녹화를 시작하는 중…</span>
      </div>
      <button id="stop" type="button" title="여기까지 녹화한 영상을 만듭니다">중지</button>
    </main>
    <main id="render" class="render" hidden>
      <header>
        <h1>시연 영상 만들기</h1>
        <p id="state">원본 녹화에 제목과 자막을 넣고 있습니다. 창을 닫으면 중지합니다.</p>
      </header>
      <div class="stage"><canvas id="canvas"></canvas></div>
      <footer>
        <progress id="progress" max="1" value="0"></progress>
        <span id="percent">0%</span>
      </footer>
    </main>
    <script src="page.js"></script>
  </body>
</html>
